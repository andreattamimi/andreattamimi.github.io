<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
  <style>
    :root {
      color-scheme: light dark;
      --ph-bg: light-dark(#ebebe4, oklch(0.218 0 0));
      --ph-border: light-dark(#d8d8cf, oklch(0.289 0 0));
