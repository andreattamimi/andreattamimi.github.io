  <rect x="12" y="12" width="576" height="276" rx="12" fill="none" stroke="var(--ph-border)" stroke-width="1"/>
  <circle cx="40" cy="40" r="6" fill="var(--ph-faint)" opacity="0.5"/>
  <circle cx="68" cy="40" r="6" fill="var(--ph-faint)" opacity="0.5"/>
  <circle cx="96" cy="40" r="6" fill="var(--ph-faint)" opacity="0.5"/>
  <rect x="40" y="130" width="420" height="14" rx="7" fill="var(--ph-border)"/>
